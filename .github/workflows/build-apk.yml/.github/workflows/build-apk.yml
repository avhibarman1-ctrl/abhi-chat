name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip project
        run: |
          unzip -o abhi-chat.zip -d app-src
          ls -R app-src | head -n 100
      - name: Build APK
        run: |
          PROJECT=$(find app-src -name "gradlew" -exec dirname {} \; | head -n 1)
          echo "Project at $PROJECT"
          cd "$PROJECT"
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: abhi-chat-apk
          path: "**/build/outputs/apk/debug/*.apk"
